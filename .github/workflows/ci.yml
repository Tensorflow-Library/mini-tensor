name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build libomp-dev
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: Address and undefined behaviour sanitizers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DMINITENSOR_SANITIZE=ON
          -DMINITENSOR_BUILD_BENCHMARKS=OFF -DMINITENSOR_BUILD_EXAMPLES=OFF
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  no-openmp:
    name: Build without OpenMP
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake -B build -G Ninja -DMINITENSOR_OPENMP=OFF
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  packaging:
    name: Install and use as a package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the library
        run: |
          cmake -B build -DMINITENSOR_BUILD_TESTS=OFF -DMINITENSOR_BUILD_EXAMPLES=OFF \
            -DMINITENSOR_BUILD_BENCHMARKS=OFF -DCMAKE_INSTALL_PREFIX="$PWD/install"
          cmake --build build --parallel
          cmake --install build
      - name: Build a program that uses it
        run: |
          cmake -S examples/consumer -B build-consumer -DCMAKE_PREFIX_PATH="$PWD/install"
          cmake --build build-consumer
          ./build-consumer/consumer

  documentation:
    name: Build the documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz
      - name: Run Doxygen
        run: doxygen docs/Doxyfile
